defaults:
  backend: openai_compatible
  api_base: http://127.0.0.1:8000/v1
  api_key_env: OPENAI_API_KEY
  max_seq_len_to_capture: 16384
  tensor_parallel_size: 1

models:
  - alias: qwen35_4b
    model_name: /data/models/Qwen3.5-4B
    request_model_name: qwen35_4b
    tensor_parallel_size: 1
  - alias: qwen35_2b
    model_name: /data/models/Qwen3.5-2B
    request_model_name: qwen35_2b
    tensor_parallel_size: 1
  - alias: qwen35_0_8b
    model_name: /data/models/Qwen3.5-0.8B
    request_model_name: qwen35_0_8b
    tensor_parallel_size: 1
